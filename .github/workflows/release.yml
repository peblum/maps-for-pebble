name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Assert the tag matches the watchapp version
        run: |
          version="v$(python3 -c 'import json; print(json.load(open("watchapp/package.json"))["version"])')"
          [ "$version" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} does not match watchapp/package.json ${version}"; exit 1; }
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: "21"
      - name: Assert the Java major version
        run: java -version 2>&1 | grep -q 'version "21\.' || { java -version; exit 1; }
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
      - name: Install the Android platform
        run: yes | sdkmanager "platforms;android-37.0" >/dev/null
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/release.keystore
            echo "KEYSTORE_FILE=release.keystore" >> "$GITHUB_ENV"
          fi
      - name: Build companion
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease testDebugUnitTest koverVerifyDebug --no-daemon
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          enable-cache: false
      - name: Install pebble-tool
        run: |
          sudo apt-get update && sudo apt-get install -y libpng-dev
          uv tool install "pebble-tool==5.0.40" --python 3.13
          pebble --version | grep -q "5.0.40" || { pebble --version; exit 1; }
      - name: Build watchapp
        working-directory: watchapp
        run: |
          pebble sdk install 4.33.1
          pebble build
      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/maps-for-pebble.apk
          cp watchapp/build/watchapp.pbw dist/maps-for-pebble.pbw
          (cd dist && sha256sum ./* > SHA256SUMS.txt)
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          files: dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-pbw
          path: dist/maps-for-pebble.pbw
          if-no-files-found: error

  publish:
    name: Publish to the Pebble appstore
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-pbw
      - name: Upload the release to the developer portal
        env:
          REBBLE_ACCESS_TOKEN: ${{ secrets.REBBLE_ACCESS_TOKEN }}
          REBBLE_APP_ID: ${{ vars.REBBLE_APP_ID }}
        run: |
          if [ -z "${REBBLE_ACCESS_TOKEN}" ] || [ -z "${REBBLE_APP_ID}" ]; then
            echo "::warning::REBBLE_ACCESS_TOKEN or REBBLE_APP_ID is not set, the release was not published to the appstore"
            exit 0
          fi
          notes="$(git tag -l --format='%(contents:body)' "${GITHUB_REF_NAME}")"
          [ -n "${notes}" ] || notes="Maps Navigation for Pebble ${GITHUB_REF_NAME}"
          curl --fail-with-body --silent --show-error \
            -X POST "https://appstore-api.rebble.io/api/dp/app/${REBBLE_APP_ID}/release" \
            -H "Authorization: Bearer ${REBBLE_ACCESS_TOKEN}" \
            -F "release_notes=${notes}" \
            -F "pbw=@maps-for-pebble.pbw"

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        if: matrix.language == 'java-kotlin'
      - name: Install the Android platform
        if: matrix.language == 'java-kotlin'
        run: yes | sdkmanager "platforms;android-37.0" >/dev/null
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'java-kotlin' && 'manual' || 'none' }}
      - name: Build the companion for analysis
        if: matrix.language == 'java-kotlin'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63
        with:
          category: /language:${{ matrix.language }}

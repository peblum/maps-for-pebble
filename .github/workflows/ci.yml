name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "21"
  ANDROID_PLATFORM: platforms;android-37.0
  PEBBLE_TOOL_VERSION: 5.0.40
  PEBBLE_SDK_VERSION: 4.33.1

jobs:
  check:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Assert the Java major version
        run: java -version 2>&1 | grep -q "version \"${JAVA_VERSION}\." || { java -version; exit 1; }
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
      - name: Install the Android platform
        run: yes | sdkmanager "${ANDROID_PLATFORM}" >/dev/null
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      - name: Install pre-commit
        run: pipx install pre-commit==4.6.2
      - name: Run hooks
        env:
          SKIP: android-unit-tests
        run: pre-commit run --all-files --show-diff-on-failure

  secrets:
    name: Secret detection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Scan the history for secrets
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --no-banner --redact --exit-code 1 .

  android:
    name: Android companion
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: check
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Assert the Java major version
        run: java -version 2>&1 | grep -q "version \"${JAVA_VERSION}\." || { java -version; exit 1; }
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
      - name: Install the Android platform
        run: yes | sdkmanager "${ANDROID_PLATFORM}" >/dev/null
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      - name: Build, test and verify coverage
        run: ./gradlew assembleDebug assembleRelease testDebugUnitTest koverVerifyDebug koverHtmlReportDebug --no-daemon
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: maps-for-pebble-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-report
          path: android/app/build/reports/kover/htmlDebug

  watchapp:
    name: Pebble watchapp
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          enable-cache: false
      - name: Install pebble-tool
        run: |
          sudo apt-get update && sudo apt-get install -y libpng-dev
          uv tool install "pebble-tool==${PEBBLE_TOOL_VERSION}" --python 3.13
          pebble --version | grep -q "${PEBBLE_TOOL_VERSION}" || { pebble --version; exit 1; }
      - name: Install the Pebble SDK
        run: pebble sdk install "${PEBBLE_SDK_VERSION}"
      - name: Build
        working-directory: watchapp
        run: pebble build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: maps-for-pebble-pbw
          path: watchapp/build/*.pbw
          if-no-files-found: error

  measure:
    name: Artifact sizes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [android, watchapp]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: maps-for-pebble-*
      - name: Record sizes
        run: |
          {
            echo "| Artifact | Bytes |"
            echo "|----------|------:|"
            for f in maps-for-pebble-apk/*/app-debug.apk maps-for-pebble-apk/*/app-release.apk maps-for-pebble-pbw/*.pbw; do
              size=$(stat -c %s "$f")
              printf '| %s | %s |\n' "$(basename "$f")" "$size"
            done
          } >> "$GITHUB_STEP_SUMMARY"
